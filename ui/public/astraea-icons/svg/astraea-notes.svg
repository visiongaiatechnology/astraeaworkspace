<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d283e"/>
      <stop offset="50%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#0f0c18"/>
    </linearGradient>
    <linearGradient id="inner-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f29"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="pri-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="border-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#645b85"/>
      <stop offset="50%" stop-color="#3b3353"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="high-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Outer Shadow & Titanium Squircle Bezel -->
  <rect x="28" y="28" width="456" height="456" rx="116" ry="116" fill="url(#chassis)" stroke="url(#border-rim)" stroke-width="8"/>
  
  <!-- LED Accent Piping on Frame -->
  <path d="M 144 32 L 368 32" stroke="#f472b6" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 144 480 L 368 480" stroke="#f472b6" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 32 144 L 32 368" stroke="#db2777" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 480 144 L 480 368" stroke="#db2777" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Inner Dark Glassmorphic Portal -->
  <rect x="52" y="52" width="408" height="408" rx="92" ry="92" fill="url(#inner-glass)" stroke="#231d36" stroke-width="3"/>
  
  <!-- Subtle Cybernetic Ambient Background Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#db2777" stroke-width="1" opacity="0.15"/>

  <!-- Central Dynamic Application Artwork -->
  
            <!-- Cybernetic Grimoire / Notebook -->
            <rect x="156" y="136" width="200" height="250" rx="16" fill="#25091c" stroke="url(#pri-grad)" stroke-width="6"/>
            <!-- Spine Binding -->
            <line x1="190" y1="136" x2="190" y2="386" stroke="#db2777" stroke-width="4"/>
            <!-- Bookmark Ribbon -->
            <path d="M210 136 L210 200 L225 185 L240 200 L240 136 Z" fill="#fb7185" filter="url(#high-glow)"/>
            <!-- Neural Network Graph on Cover -->
            <circle cx="280" cy="220" r="8" fill="#ffffff" filter="url(#glow)"/>
            <circle cx="230" cy="270" r="7" fill="#f472b6"/>
            <circle cx="310" cy="280" r="7" fill="#f472b6"/>
            <circle cx="260" cy="330" r="8" fill="#ffffff" filter="url(#glow)"/>
            <line x1="280" y1="220" x2="230" y2="270" stroke="#f472b6" stroke-width="3"/>
            <line x1="280" y1="220" x2="310" y2="280" stroke="#f472b6" stroke-width="3"/>
            <line x1="230" y1="270" x2="260" y2="330" stroke="#f472b6" stroke-width="3"/>
            <line x1="310" y1="280" x2="260" y2="330" stroke="#f472b6" stroke-width="3"/>
            <line x1="230" y1="270" x2="310" y2="280" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 3"/>
            <ellipse cx="256" cy="261" rx="155" ry="60" transform="rotate(-20 256 261)" fill="none" stroke="url(#pri-grad)" stroke-width="3.5" opacity="0.8"/>
        

  <!-- App Monogram/Badge -->
  <g opacity="0.4">
    <circle cx="78" cy="78" r="8" fill="#f472b6"/>
    <circle cx="434" cy="78" r="8" fill="#f472b6"/>
    <circle cx="78" cy="434" r="8" fill="#f472b6"/>
    <circle cx="434" cy="434" r="8" fill="#f472b6"/>
  </g>
</svg>
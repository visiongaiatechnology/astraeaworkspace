<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d283e"/>
      <stop offset="50%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#0f0c18"/>
    </linearGradient>
    <linearGradient id="inner-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f29"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="pri-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="border-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#645b85"/>
      <stop offset="50%" stop-color="#3b3353"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="high-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Outer Shadow & Titanium Squircle Bezel -->
  <rect x="28" y="28" width="456" height="456" rx="116" ry="116" fill="url(#chassis)" stroke="url(#border-rim)" stroke-width="8"/>
  
  <!-- LED Accent Piping on Frame -->
  <path d="M 144 32 L 368 32" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 144 480 L 368 480" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 32 144 L 32 368" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 480 144 L 480 368" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Inner Dark Glassmorphic Portal -->
  <rect x="52" y="52" width="408" height="408" rx="92" ry="92" fill="url(#inner-glass)" stroke="#231d36" stroke-width="3"/>
  
  <!-- Subtle Cybernetic Ambient Background Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#be123c" stroke-width="1" opacity="0.15"/>

  <!-- Central Dynamic Application Artwork -->
  
            <!-- PDF Document Sheet -->
            <path d="M166 136 L286 136 L346 196 L346 386 L166 386 Z" fill="#2d0b14" stroke="url(#pri-grad)" stroke-width="6" rx="8"/>
            <path d="M286 136 L286 196 L346 196" fill="#4c0d1c" stroke="url(#pri-grad)" stroke-width="4"/>
            <!-- PDF Badge text -->
            <rect x="196" y="210" width="80" height="34" rx="6" fill="#be123c" stroke="#ffffff" stroke-width="2"/>
            <text x="236" y="234" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="18" text-anchor="middle">PDF</text>
            <!-- Cryptographic Seal Stamp -->
            <circle cx="280" cy="310" r="38" fill="#1b060c" stroke="#f43f5e" stroke-width="4" stroke-dasharray="8 4" filter="url(#high-glow)"/>
            <circle cx="280" cy="310" r="24" fill="none" stroke="#f43f5e" stroke-width="2"/>
            <!-- Lock Icon inside Seal -->
            <rect x="272" y="304" width="16" height="14" rx="2" fill="#ffffff"/>
            <path d="M275 304 L275 298 C275 294 285 294 285 298 L285 304" fill="none" stroke="#ffffff" stroke-width="2"/>
            <ellipse cx="256" cy="266" rx="160" ry="60" transform="rotate(-25 256 266)" fill="none" stroke="url(#pri-grad)" stroke-width="3.5" opacity="0.85"/>
        

  <!-- App Monogram/Badge -->
  <g opacity="0.4">
    <circle cx="78" cy="78" r="8" fill="#f43f5e"/>
    <circle cx="434" cy="78" r="8" fill="#f43f5e"/>
    <circle cx="78" cy="434" r="8" fill="#f43f5e"/>
    <circle cx="434" cy="434" r="8" fill="#f43f5e"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d283e"/>
      <stop offset="50%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#0f0c18"/>
    </linearGradient>
    <linearGradient id="inner-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f29"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="pri-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="border-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#645b85"/>
      <stop offset="50%" stop-color="#3b3353"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="high-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Outer Shadow & Titanium Squircle Bezel -->
  <rect x="28" y="28" width="456" height="456" rx="116" ry="116" fill="url(#chassis)" stroke="url(#border-rim)" stroke-width="8"/>
  
  <!-- LED Accent Piping on Frame -->
  <path d="M 144 32 L 368 32" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 144 480 L 368 480" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 32 144 L 32 368" stroke="#059669" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 480 144 L 480 368" stroke="#059669" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Inner Dark Glassmorphic Portal -->
  <rect x="52" y="52" width="408" height="408" rx="92" ry="92" fill="url(#inner-glass)" stroke="#231d36" stroke-width="3"/>
  
  <!-- Subtle Cybernetic Ambient Background Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#059669" stroke-width="1" opacity="0.15"/>

  <!-- Central Dynamic Application Artwork -->
  
            <!-- 3D Spreadsheet Matrix Grid -->
            <g transform="translate(256 256) scale(0.9) rotate(-15) translate(-256 -256)">
                <!-- Table Base -->
                <rect x="146" y="146" width="220" height="220" rx="16" fill="#08251e" stroke="url(#pri-grad)" stroke-width="6"/>
                <!-- Grid Lines -->
                <line x1="146" y1="201" x2="366" y2="201" stroke="#059669" stroke-width="3" opacity="0.6"/>
                <line x1="146" y1="256" x2="366" y2="256" stroke="#059669" stroke-width="3" opacity="0.6"/>
                <line x1="146" y1="311" x2="366" y2="311" stroke="#059669" stroke-width="3" opacity="0.6"/>
                <line x1="201" y1="146" x2="201" y2="366" stroke="#059669" stroke-width="3" opacity="0.6"/>
                <line x1="256" y1="146" x2="256" y2="366" stroke="#059669" stroke-width="3" opacity="0.6"/>
                <line x1="311" y1="146" x2="311" y2="366" stroke="#059669" stroke-width="3" opacity="0.6"/>
                <!-- Highlighted Active Cell -->
                <rect x="204" y="204" width="49" height="49" fill="#10b981" opacity="0.4" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
                <!-- Chart Bars Rising from Cells -->
                <rect x="265" y="280" width="16" height="24" rx="3" fill="#34d399"/>
                <rect x="286" y="260" width="16" height="44" rx="3" fill="#34d399"/>
                <rect x="325" y="235" width="16" height="69" rx="3" fill="#34d399" filter="url(#high-glow)"/>
            </g>
            <ellipse cx="256" cy="256" rx="160" ry="60" transform="rotate(-20 256 256)" fill="none" stroke="url(#pri-grad)" stroke-width="4" opacity="0.8"/>
        

  <!-- App Monogram/Badge -->
  <g opacity="0.4">
    <circle cx="78" cy="78" r="8" fill="#34d399"/>
    <circle cx="434" cy="78" r="8" fill="#34d399"/>
    <circle cx="78" cy="434" r="8" fill="#34d399"/>
    <circle cx="434" cy="434" r="8" fill="#34d399"/>
  </g>
</svg>
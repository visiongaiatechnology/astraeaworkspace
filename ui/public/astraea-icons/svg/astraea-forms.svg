<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d283e"/>
      <stop offset="50%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#0f0c18"/>
    </linearGradient>
    <linearGradient id="inner-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f29"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="pri-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="border-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#645b85"/>
      <stop offset="50%" stop-color="#3b3353"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="high-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- Outer Shadow & Titanium Squircle Bezel -->
  <rect x="28" y="28" width="456" height="456" rx="116" ry="116" fill="url(#chassis)" stroke="url(#border-rim)" stroke-width="8"/>
  
  <!-- LED Accent Piping on Frame -->
  <path d="M 144 32 L 368 32" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 144 480 L 368 480" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 32 144 L 32 368" stroke="#0f766e" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 480 144 L 480 368" stroke="#0f766e" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Inner Dark Glassmorphic Portal -->
  <rect x="52" y="52" width="408" height="408" rx="92" ry="92" fill="url(#inner-glass)" stroke="#231d36" stroke-width="3"/>
  
  <!-- Subtle Cybernetic Ambient Background Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#0f766e" stroke-width="1" opacity="0.15"/>

  <!-- Central Dynamic Application Artwork -->
  
            <!-- Stacked Form Layers -->
            <rect x="176" y="136" width="180" height="240" rx="12" fill="#04211e" stroke="#0f766e" stroke-width="3" transform="rotate(6 266 256)"/>
            <rect x="156" y="146" width="180" height="240" rx="12" fill="#082b26" stroke="url(#pri-grad)" stroke-width="6"/>
            <!-- Form Header Bar -->
            <rect x="176" y="170" width="140" height="24" rx="4" fill="#0f766e"/>
            <!-- Interactive Switch Toggle -->
            <rect x="176" y="210" width="46" height="22" rx="11" fill="#14b8a6"/>
            <circle cx="211" cy="221" r="8" fill="#ffffff" filter="url(#high-glow)"/>
            <!-- Radio Buttons -->
            <circle cx="186" cy="256" r="9" fill="none" stroke="#2dd4bf" stroke-width="3"/>
            <circle cx="186" cy="256" r="4" fill="#ffffff"/>
            <line x1="206" y1="256" x2="286" y2="256" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
            <!-- Checkbox -->
            <rect x="178" y="286" width="18" height="18" rx="4" fill="#14b8a6"/>
            <path d="M182 295 L186 299 L193 291" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="206" y1="295" x2="266" y2="295" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="256" cy="256" rx="165" ry="65" transform="rotate(-25 256 256)" fill="none" stroke="url(#pri-grad)" stroke-width="3.5" opacity="0.8"/>
        

  <!-- App Monogram/Badge -->
  <g opacity="0.4">
    <circle cx="78" cy="78" r="8" fill="#2dd4bf"/>
    <circle cx="434" cy="78" r="8" fill="#2dd4bf"/>
    <circle cx="78" cy="434" r="8" fill="#2dd4bf"/>
    <circle cx="434" cy="434" r="8" fill="#2dd4bf"/>
  </g>
</svg>
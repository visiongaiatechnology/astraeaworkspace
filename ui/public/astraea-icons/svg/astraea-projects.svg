<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d283e"/>
      <stop offset="50%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#0f0c18"/>
    </linearGradient>
    <linearGradient id="inner-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150f29"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="pri-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="border-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#645b85"/>
      <stop offset="50%" stop-color="#3b3353"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="high-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Outer Shadow & Titanium Squircle Bezel -->
  <rect x="28" y="28" width="456" height="456" rx="116" ry="116" fill="url(#chassis)" stroke="url(#border-rim)" stroke-width="8"/>
  
  <!-- LED Accent Piping on Frame -->
  <path d="M 144 32 L 368 32" stroke="#4ade80" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 144 480 L 368 480" stroke="#4ade80" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 32 144 L 32 368" stroke="#16a34a" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>
  <path d="M 480 144 L 480 368" stroke="#16a34a" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Inner Dark Glassmorphic Portal -->
  <rect x="52" y="52" width="408" height="408" rx="92" ry="92" fill="url(#inner-glass)" stroke="#231d36" stroke-width="3"/>
  
  <!-- Subtle Cybernetic Ambient Background Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.15"/>

  <!-- Central Dynamic Application Artwork -->
  
            <!-- Gantt Chart Timeline Frame -->
            <rect x="136" y="146" width="240" height="220" rx="12" fill="#082414" stroke="url(#pri-grad)" stroke-width="6"/>
            <!-- Timeline Axis Grid Lines -->
            <line x1="196" y1="146" x2="196" y2="366" stroke="#16a34a" stroke-width="2" opacity="0.5" stroke-dasharray="4 4"/>
            <line x1="256" y1="146" x2="256" y2="366" stroke="#16a34a" stroke-width="2" opacity="0.5" stroke-dasharray="4 4"/>
            <line x1="316" y1="146" x2="316" y2="366" stroke="#16a34a" stroke-width="2" opacity="0.5" stroke-dasharray="4 4"/>
            <!-- Gantt Phase 1 Bar -->
            <rect x="156" y="176" width="80" height="22" rx="6" fill="#16a34a"/>
            <!-- Gantt Phase 2 Bar with Milestone -->
            <rect x="206" y="226" width="100" height="22" rx="6" fill="#22c55e" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
            <!-- Milestone Diamond -->
            <polygon points="306,237 318,225 330,237 318,249" fill="#ffffff" filter="url(#high-glow)"/>
            <!-- Gantt Phase 3 Bar -->
            <rect x="266" y="276" width="90" height="22" rx="6" fill="#16a34a"/>
            <!-- Dependency Connector line -->
            <path d="M236 198 L236 215 L206 215 L206 226" fill="none" stroke="#4ade80" stroke-width="2"/>
            <ellipse cx="256" cy="256" rx="165" ry="65" transform="rotate(-25 256 256)" fill="none" stroke="url(#pri-grad)" stroke-width="3.5" opacity="0.8"/>
        

  <!-- App Monogram/Badge -->
  <g opacity="0.4">
    <circle cx="78" cy="78" r="8" fill="#4ade80"/>
    <circle cx="434" cy="78" r="8" fill="#4ade80"/>
    <circle cx="78" cy="434" r="8" fill="#4ade80"/>
    <circle cx="434" cy="434" r="8" fill="#4ade80"/>
  </g>
</svg>